<body>

<div id="settings">
	<h1>Diff</h1>
	<label title="[Press 1]"><input type="radio" name="diff_type" value="diffChars" > Chars</label>
	<label title="[Press 2]"><input type="radio" name="diff_type" value="diffWords" checked> Words</label>
	<label title="[Press 3]"><input type="radio" name="diff_type" value="diffLines"> Lines</label>
	<label title="[Press 4]"><input type="radio" name="diff_type" value="diffPatch"> Patch</label>
	<span id="scroll-lock" class="emoji-btn" title="Toggle scroll sync [Press 5]"><span>⛓️</span></span>
	<span id="line-break-toggle" class="emoji-btn" title="Toggle line breaks [Press 6]"><span>↩</span></span>
</div>

<a href="#" id="about" class="source" title="About Online Diff" aria-label="About Online Diff">i</a>

<table>
	<tr>
		<td><div contenteditable="true" id="a">A simple tool to highlight the differences between two texts. 

No ads, no tracking, no BS. 

See the diff per char, word, line, or get the patch.</div></td>
		<td class="result-cell"><div style="padding-top: 10px;"><pre id="result"></pre></div><div id="minimap" title="Change overview"></div></td>
		<td><div contenteditable="true" id="b">Highlight the differences between two texts. 

No ads, no tracking, no BS. 

Diff per char, word, line, or get the patch.</div></td>
	</tr>
</table>

<script defer>
var a = document.getElementById('a');
var b = document.getElementById('b');
var result = document.getElementById('result');
var minimap = document.getElementById('minimap');
var resultScroller = result.parentNode;

function loadFromStorage() {
	try {
		var data = JSON.parse(localStorage.getItem('diffData'));
		if (!data) return;
		if (typeof data.a === 'string') a.textContent = data.a;
		if (typeof data.b === 'string') b.textContent = data.b;
		if (typeof data.diffType === 'string') {
			var r = document.querySelector('#settings [name="diff_type"][value="' + data.diffType + '"]');
			if (r) r.checked = true;
		}
		if (data.scrollLock === false) document.getElementById('scroll-lock').click();
		if (data.lineBreak === false) document.getElementById('line-break-toggle').click();
	} catch(e) {}
}

function saveToStorage() {
	try {
		var checked = document.querySelector('#settings [name="diff_type"]:checked');
		var data = {
			a: a.textContent,
			b: b.textContent,
			diffType: checked ? checked.value : 'diffWords',
			scrollLock: scrollLockEnabled,
			lineBreak: lineBreakEnabled
		};
		localStorage.setItem('diffData', JSON.stringify(data));
	} catch(e) {}
}

// A worker cannot be interrupted, only thrown away. So whenever one is still
// busy on a diff that nobody is waiting for any more it is terminated and
// replaced, and the diff that is wanted never has to wait in line behind it.
// Timings in the console, to see where the time goes when a diff is slow. The
// worker logs its own steps (see diff-worker.js), this is the page's side of
// it: waiting, drawing, and what got cancelled. Set to false to keep quiet.
var LOG = true;
var diffPosted = 0;     // when the diff being worked on was handed to the worker
var diffPostedGen = 0;  // and which one it is

function log(gen, text) {
	if (LOG) console.log('[diff ' + gen + '] ' + text);
}

function ms(since) {
	return Math.round(performance.now() - since) + ' ms';
}

function newDiffWorker() {
	var worker = new Worker('diff-worker.js');
	worker.onmessage = onDiffMessage;
	return worker;
}

var diffWorker = newDiffWorker();
var diffBusy = false;
var diffGen = 0;
var changeTimer = null;

var resultCell = resultScroller.parentNode;
var busyTimer = null;

// Fade the result and put a spinner on it while it is out of date.
function setBusy(on, delay) {
	clearTimeout(busyTimer);
	if (!on) {
		resultCell.classList.remove('busy');
	} else {
		busyTimer = setTimeout(function() { resultCell.classList.add('busy'); }, delay);
	}
}

// wait: how long the text has to be left alone before the diff is started.
function requestDiff(wait) {
	diffGen++;
	// The text no longer matches the diff on screen, so neither do the marks
	lastDiff = null;
	queueMarks();
	// While typing, only show it when the diff is taking its time - most are
	// back before anyone could notice. Switching diff type shows it at once:
	// the fade is soft enough not to flicker on a quick one, and the click
	// gets an answer when it is not.
	setBusy(true, wait ? wait + 150 : 0);
	// Whatever is still being worked out is for a text or a diff type that is
	// no longer on screen. Stop it now, not when the next diff starts, so it
	// is out of the way and the new worker is up by the time it is needed.
	if (diffBusy) {
		log(diffPostedGen, 'page: cancelled after ' + ms(diffPosted) + ', no longer wanted');
		diffWorker.terminate();
		diffWorker = newDiffWorker();
		diffBusy = false;
	}
	stopRefine();
	clearTimeout(changeTimer);
	changeTimer = setTimeout(function() {
		diffBusy = true;
		diffPosted = performance.now();
		diffPostedGen = diffGen;
		diffWorker.postMessage({
			gen: diffGen,
			diffType: window.diffType,
			textA: a.textContent,
			textB: b.textContent
		});
	}, wait);
}

function changed() {
	requestDiff(100);
}

var diffNodes = [];

function renderDiff(diff) {
	var started = performance.now();
	var prevScrollTop = resultScroller.scrollTop;
	var prevScrollLeft = resultScroller.scrollLeft;
	var fragment = document.createDocumentFragment();
	diffNodes = new Array(diff.length);
	for (var i = 0; i < diff.length; i++) {
		var node;
		if (diff[i].removed) {
			node = document.createElement('del');
			node.appendChild(document.createTextNode(diff[i].value));
		} else if (diff[i].added) {
			node = document.createElement('ins');
			node.appendChild(document.createTextNode(diff[i].value));
		} else if (diff[i].chunkHeader) {
			node = document.createElement('span');
			node.setAttribute('class', 'chunk-header');
			node.appendChild(document.createTextNode(diff[i].value));
		} else {
			node = document.createElement('span');
			node.setAttribute('class', 'identical');
			node.appendChild(document.createTextNode(diff[i].value));
		}
		diffNodes[i] = node;
		fragment.appendChild(node);
	}
	result.textContent = '';
	result.appendChild(fragment);
	resultScroller.scrollTop = prevScrollTop;
	resultScroller.scrollLeft = prevScrollLeft;
	var drawn = performance.now();
	renderMinimap(diff);
	log(diffGen, 'page: put ' + diff.length + ' parts on the page in ' + Math.round(drawn - started) +
		' ms, laid out and minimap drawn in ' + ms(drawn));
	lastDiff = diff;
	laneMap = undefined;
	// A new layout: what was lined up before no longer is, line up again
	scrollAnchor = null;
	queueMarks(true);
}

// Round 2: highlight the exact chars that changed inside each del/ins.
// Runs in its own worker so the primary diff is never blocked by it. If a
// newer coarse diff is asked for while it is still busy we terminate it and
// start a fresh one - cheapest possible preemption. Only the paint changes,
// never the text, so scroll position and the minimap are untouched.
var refineWorker = null;
var refineBusy = false;

function onRefineMessage(e) {
	if (e.data.gen !== diffGen) return;
	if (e.data.done) {
		refineBusy = false;
		log(diffGen, 'page: second pass (exact changes inside each change) done ' + ms(diffPosted) + ' after the diff was started');
		return;
	}
	var list = e.data.refine;
	for (var k = 0; k < list.length; k++) {
		var node = diffNodes[list[k].i];
		if (!node) continue;
		var parts = list[k].p;
		var frag = document.createDocumentFragment();
		for (var q = 0; q < parts.length; q++) {
			if (parts[q][1]) {
				var span = document.createElement('span');
				span.className = 'chg';
				span.appendChild(document.createTextNode(parts[q][0]));
				frag.appendChild(span);
			} else {
				frag.appendChild(document.createTextNode(parts[q][0]));
			}
		}
		node.textContent = '';
		node.appendChild(frag);
	}
	// The text nodes any marks pointed at have just been replaced
	queueMarks();
}

function stopRefine() {
	if (refineWorker && refineBusy) {
		refineWorker.terminate();
		refineWorker = null;
		refineBusy = false;
	}
}

function startRefine(gen, diff) {
	stopRefine();
	if (window.diffType === 'diffChars') return; // already as fine as it gets
	if (!refineWorker) {
		refineWorker = new Worker('refine-worker.js');
		refineWorker.onmessage = onRefineMessage;
	}
	refineBusy = true;
	refineWorker.postMessage({gen: gen, diff: diff, diffType: window.diffType});
}

// Marking: select text in any of the three lanes and the same text gets marked
// in the other two. The diff already knows which piece of A is which piece of B
// and where both sit in the result, so this is a lookup and not a text search -
// selecting one "the" marks that "the", not every "the" on the page.
//
// Painted with the CSS Custom Highlight API: ranges are registered from script
// and styled with ::highlight(mark). Nothing is inserted into the DOM, which is
// the only way to do this inside the editable lanes without disturbing the
// caret and the undo stack. Browsers without it simply get no marks.
var lanes = {a: a, r: result, b: b};
var LANES = ['a', 'r', 'b'];  // left to right, the same order as scrollPanels
var markHL = window.Highlight && window.StaticRange && window.CSS && CSS.highlights ? new Highlight() : null;
if (markHL) CSS.highlights.set('mark', markHL);

var lastDiff = null;  // the diff on screen, null while a newer one is on its way
var laneMap;          // built from lastDiff the first time something is selected, null if it did not check out
var marksQueued = false, alignQueued = false;

// Offsets where each line starts, plus the end of the text.
function lineStarts(text) {
	var out = [0];
	for (var i = text.indexOf('\n'); i !== -1; i = text.indexOf('\n', i + 1)) out.push(i + 1);
	if (out[out.length - 1] !== text.length) out.push(text.length);
	return out;
}

// Length of line k, given that it starts at pos and reads as body (the
// newline is optional, the last line may not have one). -1 if it does not.
function lineAt(text, starts, k, pos, body) {
	if (starts[k] !== pos || !text.startsWith(body, pos)) return -1;
	var len = starts[k + 1] - pos;
	return len === body.length || len === body.length + 1 ? len : -1;
}

function skipSpace(text, pos) {
	while (pos < text.length && /\s/.test(text[pos])) pos++;
	return pos;
}

// The map between the lanes: a list of segments, each a stretch of text with
// its [start, end) char offsets in a, b and r (the result). A lane the segment
// does not exist in gets an empty [pos, pos), which keeps every lane's offsets
// sorted so they can be bisected. n is not a lane: it holds the offsets of each
// diff node in the result, to get from an offset to its node and back.
//
// Every piece is checked against the real text while building, and the whole
// map is dropped (null) if anything is off. So a mark is either on exactly the
// right chars or not there at all.
function buildLaneMap(diff, textA, textB, isPatch) {
	var m = {a: [], b: [], r: [], n: []};
	var pa = 0, pb = 0, pr = 0;
	var linesA, linesB, ia = 0, ib = 0, inHunk = false;
	if (isPatch) {
		linesA = lineStarts(textA);
		linesB = lineStarts(textB);
	}

	function seg(lenA, lenB, r0, r1) {
		m.a.push(pa, pa + lenA);
		m.b.push(pb, pb + lenB);
		m.r.push(r0, r1);
		pa += lenA;
		pb += lenB;
	}

	for (var i = 0; i < diff.length; i++) {
		var d = diff[i], v = d.value, end = pr + v.length;
		var inA = !d.added, inB = !d.removed;
		var lenA = 0, lenB = 0;
		m.n.push(pr, end);

		if (isPatch) {
			if (d.chunkHeader) {
				var h = /^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/.exec(v);
				if (!h) return null;
				// 1-based first line of the hunk, or the line before it when
				// the hunk has no lines on that side
				ia = h[2] === '0' ? +h[1] : h[1] - 1;
				ib = h[4] === '0' ? +h[3] : h[3] - 1;
				// The unchanged lines a patch leaves out between hunks: they
				// are in A and in B, just not in the result
				if (!(linesA[ia] >= pa) || !(linesB[ib] >= pb)) return null;
				var gap = textA.slice(pa, linesA[ia]);
				if (gap !== textB.slice(pb, linesB[ib])) return null;
				seg(gap.length, gap.length, pr, pr);
				inHunk = true;
			} else if (inHunk && (d.added || d.removed || v[0] === ' ')) {
				// A line of text: skip the +/-/space in front of it
				var body = v.slice(1, -1);
				if (inA && (lenA = lineAt(textA, linesA, ia++, pa, body)) < 0) return null;
				if (inB && (lenB = lineAt(textB, linesB, ib++, pb, body)) < 0) return null;
				seg(lenA, lenB, pr + 1, end);
			}
			// Anything else (file header, "\ No newline at end of file") is
			// only in the patch
		} else if ((!inA || textA.startsWith(v, pa)) && (!inB || textB.startsWith(v, pb))) {
			seg(inA ? v.length : 0, inB ? v.length : 0, pr, end);
		} else {
			// Words mode ignores whitespace when comparing, so "unchanged"
			// text can have different spacing in A, B and the result ("a (b)"
			// and "a(b)" are the same to it). Cut it into stretches that do
			// read the same everywhere: all other chars have to match
			// exactly, only runs of whitespace may differ or be missing.
			for (var k = 0, n; k < v.length; k += n) {
				n = 0;
				if (/\s/.test(v[k])) {
					while (k + n < v.length && /\s/.test(v[k + n])) n++;
					lenA = inA ? skipSpace(textA, pa) - pa : 0;
					lenB = inB ? skipSpace(textB, pb) - pb : 0;
				} else {
					if (inA) pa = skipSpace(textA, pa);
					if (inB) pb = skipSpace(textB, pb);
					while (k + n < v.length && (!inA || textA[pa + n] === v[k + n]) && (!inB || textB[pb + n] === v[k + n])) n++;
					if (!n) return null;
					lenA = inA ? n : 0;
					lenB = inB ? n : 0;
				}
				seg(lenA, lenB, pr + k, pr + k + n);
			}
		}
		pr = end;
	}

	if (isPatch) {
		// Unchanged lines after the last hunk
		var tail = textA.slice(pa);
		if (tail !== textB.slice(pb)) return null;
		seg(tail.length, tail.length, pr, pr);
	} else if (skipSpace(textA, pa) !== textA.length || skipSpace(textB, pb) !== textB.length) {
		return null;
	}
	m.n.push(pr, pr);
	return m;
}

// Index of the first [start, end) pair that ends after pos.
function firstPairAfter(pairs, pos) {
	var lo = 0, hi = pairs.length / 2;
	while (lo < hi) {
		var mid = (lo + hi) >> 1;
		if (pairs[2 * mid + 1] > pos) hi = mid; else lo = mid + 1;
	}
	return lo;
}

// Where is [s, e) of lane `from` in the other two lanes? Returns flat
// start, end, start, end, ... lists per lane, sorted, touching stretches merged.
// at[lane] is the other way round for the first of them: the offset in `from`
// of the text that the first stretch in that lane starts with. Not always s -
// a selection that starts in removed text has nothing in B until further in.
function mapSelection(m, from, s, e) {
	var out = {a: [], r: [], b: [], at: {}};
	var src = m[from];
	for (var i = firstPairAfter(src, s); 2 * i < src.length && src[2 * i] < e; i++) {
		var srcLen = src[2 * i + 1] - src[2 * i];
		var lo = Math.max(s, src[2 * i]) - src[2 * i];
		var hi = Math.min(e, src[2 * i + 1]) - src[2 * i];
		if (hi <= lo) continue;
		for (var j = 0; j < LANES.length; j++) {
			var lane = LANES[j];
			if (lane === from) continue;
			// Same position within the segment. Only whitespace and a missing
			// last newline can make a segment differ in length between lanes;
			// selecting to its end here then means to its end there, so a tab
			// marks all four spaces it was replaced with.
			var t0 = m[lane][2 * i], len = m[lane][2 * i + 1] - t0;
			var x = t0 + Math.min(lo, len), y = t0 + (hi === srcLen ? len : Math.min(hi, len));
			if (y <= x) continue;
			var list = out[lane];
			if (!list.length) out.at[lane] = src[2 * i] + lo;
			if (list.length && list[list.length - 1] === x) list[list.length - 1] = y;
			else list.push(x, y);
		}
	}
	return out;
}

// A selection boundary as a char offset into the lane's text.
function laneOffset(lane, node, offset) {
	var root = lanes[lane], base = 0;
	if (lane === 'r') {
		// Count from the diff node rather than from the top of the result
		if (node === result) return laneMap.n[2 * offset];
		root = node;
		while (root.parentNode !== result) root = root.parentNode;
		base = laneMap.n[2 * diffNodes.indexOf(root)];
	}
	var range = document.createRange();
	range.setStart(root, 0);
	range.setEnd(node, offset);
	return base + range.toString().length;
}

// Calls fn(startNode, startOffset, endNode, endOffset) for each of the given
// char offsets (start, end, start, end, ...) into the lane's text, in one walk
// over its text nodes.
function eachRange(lane, spans, fn) {
	var walker = document.createTreeWalker(lanes[lane], NodeFilter.SHOW_TEXT);
	var pos = 0;
	if (lane === 'r') {
		// Start at the diff node of the first one, not at the top of the result
		var first = firstPairAfter(laneMap.n, spans[0]);
		walker.currentNode = diffNodes[first];
		pos = laneMap.n[2 * first];
	}
	var k = 0, startNode = null, startOffset = 0;
	for (var node = walker.nextNode(); node && k < spans.length; node = walker.nextNode()) {
		var end = pos + node.length;
		while (k < spans.length) {
			if (k & 1) {
				if (spans[k] > end) break;
				fn(startNode, startOffset, node, spans[k] - pos);
			} else {
				if (spans[k] >= end) break;
				startNode = node;
				startOffset = spans[k] - pos;
			}
			k++;
		}
		pos = end;
	}
}

// StaticRange and not Range: the browser has to keep every live Range up to
// date on each DOM change, and round 2 changes a lot of DOM.
function addMark(startNode, startOffset, endNode, endOffset) {
	markHL.add(new StaticRange({
		startContainer: startNode, startOffset: startOffset,
		endContainer: endNode, endOffset: endOffset
	}));
}

// How far down the screen the char at offset pos of the lane's text is, or
// null if it has no box to measure.
function topOf(lane, pos) {
	var top = null;
	eachRange(lane, [pos, pos + 1], function(startNode, startOffset, endNode, endOffset) {
		var range = document.createRange();
		range.setStart(startNode, startOffset);
		range.setEnd(endNode, endOffset);
		var rects = range.getClientRects();
		if (rects.length) top = rects[0].top;
	});
	return top;
}

function updateMarks() {
	var align = alignQueued;
	marksQueued = alignQueued = false;
	markHL.clear();
	if (!lastDiff) return;
	var sel = window.getSelection();
	if (!sel || !sel.rangeCount || sel.isCollapsed) return;
	// The lane the selection was started in. It can run out of that lane (a
	// triple click in the result ends in the next lane), so anything outside
	// is cut off.
	var from = a.contains(sel.anchorNode) ? 'a' : b.contains(sel.anchorNode) ? 'b' : result.contains(sel.anchorNode) ? 'r' : null;
	if (!from) return;
	if (laneMap === undefined) {
		var mapStarted = performance.now();
		laneMap = buildLaneMap(lastDiff, a.textContent, b.textContent, window.diffType === 'diffPatch');
		log(diffGen, 'page: map for marking text built in ' + ms(mapStarted) + (laneMap ? '' : ' - it did not check out, no marks'));
	}
	if (!laneMap) return;
	var range = sel.getRangeAt(0);
	var root = lanes[from];
	var s = root.contains(range.startContainer) ? laneOffset(from, range.startContainer, range.startOffset) : 0;
	var e = root.contains(range.endContainer) ? laneOffset(from, range.endContainer, range.endOffset) : Infinity;
	var spans = mapSelection(laneMap, from, s, e);
	for (var j = 0; j < LANES.length; j++) {
		if (spans[LANES[j]].length) eachRange(LANES[j], spans[LANES[j]], addMark);
	}
	if (align) alignMarks(from, spans);
}

// align: also line the lanes up on the marks (see alignMarks). For when the
// selection or the layout is new, not for a repaint of the marks.
function queueMarks(align) {
	if (!markHL) return;
	if (align) alignQueued = true;
	if (marksQueued) return;
	marksQueued = true;
	requestAnimationFrame(updateMarks);
}

document.addEventListener('selectionchange', function() { queueMarks(true); });

function alignMinimap() {
	var offset = 15;
	minimap.style.top = (resultScroller.offsetTop + offset) + 'px';
	minimap.style.height = Math.max(0, resultScroller.offsetHeight - offset) + 'px';
}

function renderMinimap() {
	alignMinimap();
	minimap.textContent = '';
	var H = minimap.clientHeight;
	if (!H) {
		requestAnimationFrame(renderMinimap);
		return;
	}
	var contentH = resultScroller.scrollHeight;
	if (!contentH) return;
	var sr = resultScroller.getBoundingClientRect();
	var marks = result.querySelectorAll('ins, del');
	var slices = [];
	for (var i = 0; i < marks.length; i++) {
		var m = marks[i];
		var mr = m.getBoundingClientRect();
		var top = (mr.top - sr.top) + resultScroller.scrollTop;
		var y = (top / contentH) * H;
		var hh = Math.max(3, (mr.height / contentH) * H);
		if (y < 0) y = 0;
		if (y + hh > H) y = Math.max(0, H - hh);
		slices.push({type: m.tagName === 'INS' ? 'mm-ins' : 'mm-del', top: y, bottom: y + hh});
	}
	slices.sort(function(a, b) { return a.top - b.top; });
	var GAP = 4;
	var merged = [];
	for (var j = 0; j < slices.length; j++) {
		var s = slices[j];
		var prev = merged[merged.length - 1];
		if (prev && s.top <= prev.bottom + GAP) {
			if (prev.type === s.type) {
				prev.bottom = Math.max(prev.bottom, s.bottom);
			} else {
				prev.bottom = s.top;
				merged.push(s);
			}
		} else {
			merged.push(s);
		}
	}
	var frag = document.createDocumentFragment();
	for (var k = 0; k < merged.length; k++) {
		var sl = merged[k];
		var span = document.createElement('span');
		span.className = sl.type;
		span.style.top = sl.top + 'px';
		span.style.height = (sl.bottom - sl.top) + 'px';
		frag.appendChild(span);
	}
	minimap.appendChild(frag);
}

minimap.addEventListener('click', function(e) {
	var rect = minimap.getBoundingClientRect();
	var pct = (e.clientY - rect.top) / rect.height;
	var contentY = pct * resultScroller.scrollHeight;
	var maxY = resultScroller.scrollHeight - resultScroller.clientHeight;
	resultScroller.scrollTop = Math.max(0, Math.min(maxY, contentY - resultScroller.clientHeight / 2));

	// Also center horizontally on the nearest mark
	var marks = result.querySelectorAll('ins, del');
	if (marks.length) {
		var sr = resultScroller.getBoundingClientRect();
		var nearest = null, bestDist = Infinity;
		for (var i = 0; i < marks.length; i++) {
			var mr = marks[i].getBoundingClientRect();
			var mTop = (mr.top - sr.top) + resultScroller.scrollTop;
			var d = Math.abs(mTop - contentY);
			if (d < bestDist) { bestDist = d; nearest = marks[i]; }
		}
		if (nearest) {
			var nr = nearest.getBoundingClientRect();
			var mLeft = (nr.left - sr.left) + resultScroller.scrollLeft;
			var maxX = resultScroller.scrollWidth - resultScroller.clientWidth;
			resultScroller.scrollLeft = Math.max(0, Math.min(maxX, mLeft - resultScroller.clientWidth / 2));
		}
	}
	syncScroll(resultScroller);
});

// Wheel scrolling is done here and not left to the browser. Left alone, the
// lane under the pointer scrolls at once and the other two only hear of it in
// a scroll event a frame later - and lanes that are meant to move as one then
// wobble against each other all the way. Moving all three in the same step
// puts them on screen together. Outside the lanes the wheel scrolls the result.
function onWheel(e) {
	if (e.ctrlKey) return; // pinch to zoom
	var lane = e.target.closest && e.target.closest('#a, #b, td > div:not(#minimap)');
	// With the lanes on their own the browser can do it, there is nothing to keep together
	if (lane && !scrollLockEnabled) return;
	var panel = lane || resultScroller;
	var dx = e.deltaX, dy = e.deltaY;
	if (e.shiftKey && !dx) { dx = dy; dy = 0; }
	if (e.deltaMode) {
		// A mouse wheel that counts in lines (18px each here) or in pages
		var unit = e.deltaMode === 1 ? 18 : panel.clientHeight;
		dx *= unit;
		dy *= unit;
	}
	// One direction at a time, as the browser does it: no finger moves dead
	// straight, and the text should not drift sideways on the way down
	if (lineBreakEnabled || Math.abs(dy) >= Math.abs(dx)) dx = 0; else dy = 0;
	panel.scrollTop += dy;
	panel.scrollLeft += dx;
	syncScroll(panel);
	scrollPut[[].indexOf.call(scrollPanels, panel)] = [panel.scrollTop, panel.scrollLeft];
	e.preventDefault();
}
window.addEventListener('wheel', onWheel, {passive: false});

var resizeTimer = null;
window.addEventListener('resize', function() {
	clearTimeout(resizeTimer);
	resizeTimer = setTimeout(renderMinimap, 100);
	scrollAnchor = null;
});

function onDiffMessage(e) {
	if (e.target !== diffWorker) return; // a last word from one already replaced
	diffBusy = false;
	if (e.data.gen !== diffGen) return;
	log(diffGen, 'page: answer back ' + ms(diffPosted) + ' after it was sent to the worker');
	result.className = '';
	renderDiff(e.data.diff);
	setBusy(false);
	log(diffGen, 'page: handed to the browser ' + ms(diffPosted) + ' after it was sent to the worker');
	if (LOG) {
		// The browser still has to paint it, which no script can time from the
		// inside. The first moment it lets a script run again after a frame is
		// as close as it gets.
		var gen = diffGen, posted = diffPosted;
		requestAnimationFrame(function() {
			setTimeout(function() { log(gen, 'page: painted ' + ms(posted) + ' after it was sent to the worker'); }, 0);
		});
	}
	startRefine(e.data.gen, e.data.diff);
}

window.onload = function() {
	loadFromStorage();
	onDiffTypeChange(document.querySelector('#settings [name="diff_type"]:checked'));
	changed();
};

a.onchange = b.onchange = changed;

if ('oninput' in a) {
	a.oninput = b.oninput = changed;
} else {
	a.onkeyup = b.onkeyup = changed;
}

// Put only plain text on the clipboard, so pasting into Word etc.
// does not carry the monospace font from the page's CSS.
function plainTextClipboard(e) {
	var sel = window.getSelection();
	if (!sel || sel.isCollapsed) return;
	var text = sel.toString();
	if (!text) return;
	var cd = e.clipboardData;
	if (!cd) return;
	cd.setData('text/plain', text);
	e.preventDefault();
	if (e.type === 'cut') document.execCommand('delete');
}

// Dragging text out takes a different path than copy.
function plainTextDrag(e) {
	var sel = window.getSelection();
	if (!sel || sel.isCollapsed) return;
	var text = sel.toString();
	if (!text) return;
	var dt = e.dataTransfer;
	if (!dt) return;
	dt.clearData();
	dt.setData('text/plain', text);
	internalDrag = true;
	// no preventDefault here - that would cancel the drag
}

var internalDrag = false;
document.addEventListener('dragend', function() { internalDrag = false; });

// Unicode's own definition of "carries no visible content" - 4174 code points
// covering zero-width spaces, bidi controls, variation selectors, tag chars and
// the ranges reserved for exactly this. Using the standard's property rather
// than a hand-kept list means we inherit its coverage and its future updates.
// In a diff these matter because they show up as changes you cannot see.
var CLEAN = /\u{1F3F4}[\u{E0020}-\u{E007E}]+\u{E007F}|\p{Default_Ignorable_Code_Point}/gu;

function stripInvisible(text) {
	return text.replace(CLEAN, function(match) {
		// A complete flag sequence (waving black flag + tag letters + cancel tag)
		// is the only live use of the tag block - keep it whole. Loose tag chars
		// not forming a flag are still stripped.
		if (match.codePointAt(0) === 0x1F3F4) return match;
		// The two joiners with real rendering purpose: stripping these visibly
		// breaks emoji, turning a family into separate people and a red heart grey.
		if (match === '\u200D' || match === '\uFE0F') return match;
		return '';
	});
}

// Insert plain text at the caret, keeping newlines as newlines.
// execCommand('insertText') splits on \n and wraps each line in a <div>, which
// textContent then flattens - every line break lost. insertHTML with the text
// escaped goes through the same path as a native paste: in this pre-wrap,
// plaintext-only box the \n stay as text, and it is on the native undo stack.
function insertPlainText(text) {
	text = stripInvisible(text).replace(/\r\n?/g, '\n');
	var html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
	document.execCommand('insertHTML', false, html);
}

// Paste and drop are the only ways this text can arrive from elsewhere,
// so they are the only places worth cleaning.
function cleanPaste(e) {
	var cd = e.clipboardData;
	if (!cd) return;
	var text = cd.getData('text/plain');
	if (!text) return;
	e.preventDefault();
	insertPlainText(text);
	changed();
}

function caretRangeAt(x, y) {
	if (document.caretRangeFromPoint) return document.caretRangeFromPoint(x, y);
	if (document.caretPositionFromPoint) {
		var pos = document.caretPositionFromPoint(x, y);
		if (!pos) return null;
		var r = document.createRange();
		r.setStart(pos.offsetNode, pos.offset);
		r.collapse(true);
		return r;
	}
	return null;
}

function cleanDrop(e) {
	// A drag that started inside our own panes is a move of already-clean
	// text. Let the browser handle it natively, or preventing the default
	// would insert a copy without removing the original.
	if (internalDrag) return;
	var dt = e.dataTransfer;
	if (!dt) return;
	var text = dt.getData('text/plain');
	if (!text) return;
	e.preventDefault();
	var range = caretRangeAt(e.clientX, e.clientY);
	if (range) {
		var sel = window.getSelection();
		sel.removeAllRanges();
		sel.addRange(range);
	}
	insertPlainText(text);
	changed();
}

var panes = [a, b];
for (var p = 0; p < panes.length; p++) {
	panes[p].addEventListener('copy', plainTextClipboard);
	panes[p].addEventListener('cut', plainTextClipboard);
	panes[p].addEventListener('dragstart', plainTextDrag);
	panes[p].addEventListener('paste', cleanPaste);
	panes[p].addEventListener('drop', cleanDrop);
}

window.onbeforeunload = function() {
	saveToStorage();
};

function onDiffTypeChange(radio) {
	window.diffType = radio.value;
	document.title = "Diff " + radio.value.slice(4);
}

var radio = document.getElementsByName('diff_type');
for (var i = 0; i < radio.length; i++) {
	radio[i].onchange = function(e) {
		onDiffTypeChange(e.target);
		requestDiff(0);
		saveToStorage();
	}
}

function isTyping(el) {
	if (!el) return false;
	if (el.isContentEditable) return true;
	var tag = el.tagName;
	if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
	if (tag === 'INPUT') {
		var type = (el.type || 'text').toLowerCase();
		return type !== 'radio' && type !== 'checkbox' && type !== 'button' && type !== 'submit';
	}
	return false;
}

document.addEventListener('keydown', function(e) {
	if (e.metaKey || e.ctrlKey || e.altKey) return;
	// Esc leaves the text box so the number shortcuts take over again
	if (e.key === 'Escape' || e.key === 'Esc') {
		var el = document.activeElement;
		if (isTyping(el)) {
			el.blur();
			if (window.getSelection) window.getSelection().removeAllRanges();
			saveToStorage();
			e.preventDefault();
		}
		return;
	}
	if (isTyping(e.target) || isTyping(document.activeElement)) return;
	if (e.key === '1') { radio[0].click(); }
	if (e.key === '2') { radio[1].click(); }
	if (e.key === '3') { radio[2].click(); }
	if (e.key === '4') { radio[3].click(); }
	if (e.key === '5') { scrollLockBtn.click(); }
	if (e.key === '6') { lineBreakToggle.click(); }
});

// About
document.getElementById('about').onclick = function() {
	alert('I got really tired of always having to search for a tool to compare text online and having to click a few times to find one with no BS - so I got a memorable domain and made the tool I would be looking for myself. No tracking. No watermarks. No ads.\n\nEnjoy...\n\n@rangelwulff');
	return false;
};

// Scroll sync
var scrollLockEnabled = true;
var scrollLockBtn = document.getElementById('scroll-lock');
var scrollPanels = document.querySelectorAll('td > div:not(#minimap)');
// Where each panel was last put by us, as [top, left]. Moving a panel makes it
// fire a scroll event like any other, and without this there is no telling it
// from the user scrolling: the lane that was moved would turn round and move
// the others, the one being scrolled included, back to where it was a frame
// ago.
var scrollPut = [];

function putScroll(j, top, left) {
	var panel = scrollPanels[j];
	panel.scrollTop = top;
	panel.scrollLeft = left;
	// Read back: the browser rounds and clamps
	scrollPut[j] = [panel.scrollTop, panel.scrollLeft];
}

function onPanelScroll(j) {
	var panel = scrollPanels[j], put = scrollPut[j];
	if (put && Math.abs(panel.scrollTop - put[0]) < 0.5 && Math.abs(panel.scrollLeft - put[1]) < 0.5) return;
	syncScroll(panel);
}

scrollLockBtn.onclick = function() {
	scrollLockEnabled = !scrollLockEnabled;
	scrollLockBtn.classList.toggle('disabled', !scrollLockEnabled);
	saveToStorage();
};

// Line break toggle
var lineBreakEnabled = true;
var lineBreakToggle = document.getElementById('line-break-toggle');

lineBreakToggle.onclick = function() {
	lineBreakEnabled = !lineBreakEnabled;
	lineBreakToggle.classList.toggle('disabled', !lineBreakEnabled);
	
	// Toggle white-space property for all text areas
	var textAreas = document.querySelectorAll('#a, #b, #result');
	for (var i = 0; i < textAreas.length; i++) {
		textAreas[i].style.whiteSpace = lineBreakEnabled ? 'pre-wrap' : 'pre';
	}
	for (var j = 0; j < scrollPanels.length; j++) {
		scrollPanels[j].style.overflowX = lineBreakEnabled ? 'hidden' : 'auto';
	}
	scrollAnchor = null;
	renderMinimap();
	saveToStorage();
};

// Scroll sync is proportional: top meets top, bottom meets bottom and in
// between each lane moves at the speed its own height calls for. That cannot
// keep any one piece of text level across lanes, as the result is longer than
// A and B by everything that was added or removed.
//
// Marking text lines the lanes up on the marks (alignMarks), and scrollAnchor
// remembers where each panel was when it did. From there the lanes move
// together 1:1, so what was lined up stays lined up, for up to a screen either
// way - about as long as the marks can be seen. Past that each lane spreads
// what it has left over what the others have left, so top still meets top and
// bottom still meets bottom. One curve through the anchor, the same whichever
// lane is being scrolled, so nothing jumps when another lane takes over.
var scrollAnchor = null;

function syncScroll(source) {
	if (!scrollLockEnabled) return;

	var anchor = scrollAnchor;
	var max = [], s = 0, j;
	var up = scrollPanels[0].clientHeight, down = up;
	for (j = 0; j < scrollPanels.length; j++) {
		max[j] = scrollPanels[j].scrollHeight - scrollPanels[j].clientHeight;
		if (scrollPanels[j] === source) s = j;
		// An anchor further down than the lane now goes is from another text
		if (anchor && anchor[j] > max[j] + 1) anchor = scrollAnchor = null;
		if (anchor) {
			up = Math.min(up, anchor[j]);
			down = Math.min(down, Math.max(0, max[j] - anchor[j]));
		}
	}
	// Clamped, as a bouncing scroll goes past both ends
	var top = Math.max(0, Math.min(max[s], source.scrollTop));
	var maxScrollLeft = source.scrollWidth - source.clientWidth;
	var pctLeft = maxScrollLeft > 0 ? source.scrollLeft / maxScrollLeft : 0;

	for (j = 0; j < scrollPanels.length; j++) {
		if (scrollPanels[j] !== source) {
			var target;
			if (!anchor) {
				target = max[s] > 0 ? top / max[s] * max[j] : 0;
			} else if (top < anchor[s] - up) {
				target = top / (anchor[s] - up) * (anchor[j] - up);
			} else if (top <= anchor[s] + down) {
				target = anchor[j] + top - anchor[s];
			} else {
				target = anchor[j] + down + (top - anchor[s] - down) / (max[s] - anchor[s] - down) * (max[j] - anchor[j] - down);
			}
			var targetMaxLeft = scrollPanels[j].scrollWidth - scrollPanels[j].clientWidth;
			putScroll(j, target, pctLeft * targetMaxLeft);
		}
	}
}

// Scroll the other lanes so that their first mark is at the same height as the
// text it belongs to in the lane being marked in. That lane never moves: the
// text under the pointer stays where it is. A lane that is already at its top
// or bottom goes as far as it can.
function alignMarks(from, spans) {
	if (!scrollLockEnabled) return;
	var view = scrollPanels[LANES.indexOf(from)].getBoundingClientRect();
	var aligned = false;
	for (var j = 0; j < LANES.length; j++) {
		var lane = LANES[j];
		if (lane === from || !spans[lane].length) continue;
		// Nothing to line up with once the start of the marked text is out of
		// view, as after a select all halfway down
		var here = topOf(from, spans.at[lane]);
		if (here === null || here < view.top || here > view.bottom) continue;
		var there = topOf(lane, spans[lane][0]);
		if (there === null) continue;
		putScroll(j, scrollPanels[j].scrollTop + there - here, scrollPanels[j].scrollLeft);
		aligned = true;
	}
	if (!aligned) return;
	scrollAnchor = [];
	for (j = 0; j < scrollPanels.length; j++) scrollAnchor[j] = scrollPanels[j].scrollTop;
}

for (var k = 0; k < scrollPanels.length; k++) {
	(function(j) {
		scrollPanels[j].addEventListener('scroll', function() { onPanelScroll(j); }, {passive: true});
	})(k);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en-AU">
<head>
	<meta charset="utf-8">
	<title>Online Diff - Compare Text Differences Instantly</title>
	<meta name="description" content="Compare text online to highlight differences. No clutter and no BS. Highlight changes by char, word, line, or see patch."/>
	<meta name="keywords" content="online diff, text comparison, compare text, diff tool"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<meta property="og:title" content="Online Diff - Compare Text Differences Instantly"/>
	<meta property="og:description" content="Compare text online and highlight differences without clutter."/>
	<meta property="og:type" content="website"/>
	<meta property="og:url" content="https://onlinediff.com/"/>
	<link rel="canonical" href="https://onlinediff.com/"/>
	<link rel="stylesheet" href="style.css"/>
	<script type="application/ld+json">
	{
	  "@context": "https://schema.org",
	  "@type": "WebApplication",
	  "name": "Online Diff",
	  "url": "https://onlinediff.com/",
	  "applicationCategory": "Utility",
	  "description": "Compare text online and highlight changes without clutter.",
	  "operatingSystem": "All"
	}
	</script>
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="manifest" href="/site.webmanifest">
</head>
<body>

<div id="settings">
	<h1>Diff</h1>
	<label title="[Press 1]"><input type="radio" name="diff_type" value="diffChars" > Chars</label>
	<label title="[Press 2]"><input type="radio" name="diff_type" value="diffWords" checked> Words</label>
	<label title="[Press 3]"><input type="radio" name="diff_type" value="diffLines"> Lines</label>
	<label title="[Press 4]"><input type="radio" name="diff_type" value="diffPatch"> Patch</label>
	<span id="scroll-lock" class="emoji-btn" title="Toggle scroll sync [Press 5]"><span>⛓️</span></span>
	<span id="line-break-toggle" class="emoji-btn" title="Toggle line breaks [Press 6]"><span>↩</span></span>
</div>

<a href="#" onclick="alert('I got really tired of always having to search for a tool to compare text online and having to finding one with no BS - so got a memorable domain and made the tool I would be looking for myself.\n\nEnjoy...\n\n@rangelwulff');return false;" class="source">Why?</a>

<table>
	<tr>
		<td><div contenteditable="true" id="a">A simple tool to highlight the differences between two texts. 

No ads, no tracking, no BS. 

See the diff per char, word, line, or get the patch.</div></td>
		<td class="result-cell"><div style="padding-top: 10px;"><pre id="result"></pre></div><div id="minimap" title="Change overview"></div></td>
		<td><div contenteditable="true" id="b">Highlight the differences between two texts. 

No ads, no tracking, no BS. 

Diff per char, word, line, or get the patch.</div></td>
	</tr>
</table>

<script defer>
var a = document.getElementById('a');
var b = document.getElementById('b');
var result = document.getElementById('result');
var minimap = document.getElementById('minimap');
var resultScroller = result.parentNode;

function loadFromStorage() {
	try {
		var data = JSON.parse(localStorage.getItem('diffData'));
		if (!data) return;
		if (typeof data.a === 'string') a.textContent = data.a;
		if (typeof data.b === 'string') b.textContent = data.b;
		if (typeof data.diffType === 'string') {
			var r = document.querySelector('#settings [name="diff_type"][value="' + data.diffType + '"]');
			if (r) r.checked = true;
		}
		if (data.scrollLock === false) document.getElementById('scroll-lock').click();
		if (data.lineBreak === false) document.getElementById('line-break-toggle').click();
	} catch(e) {}
}

function saveToStorage() {
	try {
		var checked = document.querySelector('#settings [name="diff_type"]:checked');
		var data = {
			a: a.textContent,
			b: b.textContent,
			diffType: checked ? checked.value : 'diffWords',
			scrollLock: scrollLockEnabled,
			lineBreak: lineBreakEnabled
		};
		localStorage.setItem('diffData', JSON.stringify(data));
	} catch(e) {}
}

var diffWorker = new Worker('diff-worker.js');
var diffGen = 0;
var changeTimer = null;

function changed() {
	diffGen++;
	clearTimeout(changeTimer);
	changeTimer = setTimeout(function() {
		diffWorker.postMessage({
			gen: diffGen,
			diffType: window.diffType,
			textA: a.textContent,
			textB: b.textContent
		});
	}, 100);
}

function renderDiff(diff) {
	var prevScrollTop = resultScroller.scrollTop;
	var prevScrollLeft = resultScroller.scrollLeft;
	var fragment = document.createDocumentFragment();
	for (var i = 0; i < diff.length; i++) {
		var node;
		if (diff[i].removed) {
			node = document.createElement('del');
			node.appendChild(document.createTextNode(diff[i].value));
		} else if (diff[i].added) {
			node = document.createElement('ins');
			node.appendChild(document.createTextNode(diff[i].value));
		} else if (diff[i].chunkHeader) {
			node = document.createElement('span');
			node.setAttribute('class', 'chunk-header');
			node.appendChild(document.createTextNode(diff[i].value));
		} else {
			node = document.createElement('span');
			node.setAttribute('class', 'identical');
			node.appendChild(document.createTextNode(diff[i].value));
		}
		fragment.appendChild(node);
	}
	result.textContent = '';
	result.appendChild(fragment);
	resultScroller.scrollTop = prevScrollTop;
	resultScroller.scrollLeft = prevScrollLeft;
	renderMinimap(diff);
}

function alignMinimap() {
	var offset = 15;
	minimap.style.top = (resultScroller.offsetTop + offset) + 'px';
	minimap.style.height = Math.max(0, resultScroller.offsetHeight - offset) + 'px';
}

function renderMinimap() {
	alignMinimap();
	minimap.textContent = '';
	var H = minimap.clientHeight;
	if (!H) {
		requestAnimationFrame(renderMinimap);
		return;
	}
	var contentH = resultScroller.scrollHeight;
	if (!contentH) return;
	var sr = resultScroller.getBoundingClientRect();
	var marks = result.querySelectorAll('ins, del');
	var slices = [];
	for (var i = 0; i < marks.length; i++) {
		var m = marks[i];
		var mr = m.getBoundingClientRect();
		var top = (mr.top - sr.top) + resultScroller.scrollTop;
		var y = (top / contentH) * H;
		var hh = Math.max(3, (mr.height / contentH) * H);
		if (y < 0) y = 0;
		if (y + hh > H) y = Math.max(0, H - hh);
		slices.push({type: m.tagName === 'INS' ? 'mm-ins' : 'mm-del', top: y, bottom: y + hh});
	}
	slices.sort(function(a, b) { return a.top - b.top; });
	var GAP = 4;
	var merged = [];
	for (var j = 0; j < slices.length; j++) {
		var s = slices[j];
		var prev = merged[merged.length - 1];
		if (prev && s.top <= prev.bottom + GAP) {
			if (prev.type === s.type) {
				prev.bottom = Math.max(prev.bottom, s.bottom);
			} else {
				prev.bottom = s.top;
				merged.push(s);
			}
		} else {
			merged.push(s);
		}
	}
	var frag = document.createDocumentFragment();
	for (var k = 0; k < merged.length; k++) {
		var sl = merged[k];
		var span = document.createElement('span');
		span.className = sl.type;
		span.style.top = sl.top + 'px';
		span.style.height = (sl.bottom - sl.top) + 'px';
		frag.appendChild(span);
	}
	minimap.appendChild(frag);
}

minimap.addEventListener('click', function(e) {
	var rect = minimap.getBoundingClientRect();
	var pct = (e.clientY - rect.top) / rect.height;
	var contentY = pct * resultScroller.scrollHeight;
	var maxY = resultScroller.scrollHeight - resultScroller.clientHeight;
	resultScroller.scrollTop = Math.max(0, Math.min(maxY, contentY - resultScroller.clientHeight / 2));

	// Also center horizontally on the nearest mark
	var marks = result.querySelectorAll('ins, del');
	if (marks.length) {
		var sr = resultScroller.getBoundingClientRect();
		var nearest = null, bestDist = Infinity;
		for (var i = 0; i < marks.length; i++) {
			var mr = marks[i].getBoundingClientRect();
			var mTop = (mr.top - sr.top) + resultScroller.scrollTop;
			var d = Math.abs(mTop - contentY);
			if (d < bestDist) { bestDist = d; nearest = marks[i]; }
		}
		if (nearest) {
			var nr = nearest.getBoundingClientRect();
			var mLeft = (nr.left - sr.left) + resultScroller.scrollLeft;
			var maxX = resultScroller.scrollWidth - resultScroller.clientWidth;
			resultScroller.scrollLeft = Math.max(0, Math.min(maxX, mLeft - resultScroller.clientWidth / 2));
		}
	}
	syncScroll(resultScroller);
});

function forwardWheel(e) {
	if (e.target.closest('#a, #b, td > div:not(#minimap)')) return;
	resultScroller.scrollTop += e.deltaY;
	resultScroller.scrollLeft += e.deltaX;
	syncScroll(resultScroller);
	e.preventDefault();
}
window.addEventListener('wheel', forwardWheel, {passive: false});

var resizeTimer = null;
window.addEventListener('resize', function() {
	clearTimeout(resizeTimer);
	resizeTimer = setTimeout(renderMinimap, 100);
});

diffWorker.onmessage = function(e) {
	if (e.data.gen !== diffGen) return;
	result.className = '';
	renderDiff(e.data.diff);
};

window.onload = function() {
	loadFromStorage();
	onDiffTypeChange(document.querySelector('#settings [name="diff_type"]:checked'));
	changed();
};

a.onpaste = a.onchange =
b.onpaste = b.onchange = changed;

if ('oninput' in a) {
	a.oninput = b.oninput = changed;
} else {
	a.onkeyup = b.onkeyup = changed;
}

window.onbeforeunload = function() {
	saveToStorage();
};

function onDiffTypeChange(radio) {
	window.diffType = radio.value;
	document.title = "Diff " + radio.value.slice(4);
}

var radio = document.getElementsByName('diff_type');
for (var i = 0; i < radio.length; i++) {
	radio[i].onchange = function(e) {
		onDiffTypeChange(e.target);
		changed();
		saveToStorage();
	}
}

document.addEventListener('keydown', function(e) {
	if (e.key === '1') { radio[0].click(); }
	if (e.key === '2') { radio[1].click(); }
	if (e.key === '3') { radio[2].click(); }
	if (e.key === '4') { radio[3].click(); }
	if (e.key === '5') { scrollLockBtn.click(); }
	if (e.key === '6') { lineBreakToggle.click(); }
});

// Scroll sync
var scrollLockEnabled = true;
var scrollLockBtn = document.getElementById('scroll-lock');
var scrollPanels = document.querySelectorAll('td > div:not(#minimap)');
var scrollSource = null;

scrollLockBtn.onclick = function() {
	scrollLockEnabled = !scrollLockEnabled;
	scrollLockBtn.classList.toggle('disabled', !scrollLockEnabled);
	saveToStorage();
};

// Line break toggle
var lineBreakEnabled = true;
var lineBreakToggle = document.getElementById('line-break-toggle');

lineBreakToggle.onclick = function() {
	lineBreakEnabled = !lineBreakEnabled;
	lineBreakToggle.classList.toggle('disabled', !lineBreakEnabled);
	
	// Toggle white-space property for all text areas
	var textAreas = document.querySelectorAll('#a, #b, #result');
	for (var i = 0; i < textAreas.length; i++) {
		textAreas[i].style.whiteSpace = lineBreakEnabled ? 'pre-wrap' : 'pre';
	}
	for (var j = 0; j < scrollPanels.length; j++) {
		scrollPanels[j].style.overflowX = lineBreakEnabled ? 'hidden' : 'auto';
	}
	renderMinimap();
	saveToStorage();
};

function syncScroll(source) {
	if (!scrollLockEnabled) return;
	if (scrollSource && scrollSource !== source) return;
	scrollSource = source;

	var maxScroll = source.scrollHeight - source.clientHeight;
	var pct = maxScroll > 0 ? source.scrollTop / maxScroll : 0;
	var maxScrollLeft = source.scrollWidth - source.clientWidth;
	var pctLeft = maxScrollLeft > 0 ? source.scrollLeft / maxScrollLeft : 0;

	for (var j = 0; j < scrollPanels.length; j++) {
		if (scrollPanels[j] !== source) {
			var targetMax = scrollPanels[j].scrollHeight - scrollPanels[j].clientHeight;
			scrollPanels[j].scrollTop = pct * targetMax;
			var targetMaxLeft = scrollPanels[j].scrollWidth - scrollPanels[j].clientWidth;
			scrollPanels[j].scrollLeft = pctLeft * targetMaxLeft;
		}
	}

	requestAnimationFrame(function() {
		scrollSource = null;
	});
}

for (var k = 0; k < scrollPanels.length; k++) {
	(function(panel) {
		panel.addEventListener('scroll', function() { syncScroll(panel); }, {passive: true});
	})(scrollPanels[k]);
}
</script>
</body>
</html>
